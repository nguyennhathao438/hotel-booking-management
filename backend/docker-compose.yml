services:
  db:
    image: mysql:8.0
    container_name: hotel_booking_db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hotel_booking_management
    ports:
      - "3306:3306"
    volumes:
      - db-hotel_booking:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    image: hao438/hotel_booking_be:0.0.1
    container_name: hotel_booking_be
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hotel_booking_management
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db-hotel_booking:
