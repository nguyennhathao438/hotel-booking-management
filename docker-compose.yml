services:
  db:
    image: mysql:8.0
    container_name: hotel_booking_db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hotel_booking_management
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - db-hotel_booking:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network

  app:
    image: hao438/hotel_booking_be:0.1.3
    container_name: hotel_booking_be
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hotel_booking_management
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      TZ: Asia/Ho_Chi_Minh
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: hotel_booking_fe
    ports:
      - "5173:80"
    depends_on:
      - app
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network

volumes:
  db-hotel_booking:

networks:
  app-network:
    driver: bridge
